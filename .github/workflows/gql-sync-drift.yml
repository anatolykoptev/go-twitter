# gql-sync drift check
#
# Weekly drift detection for the generated GraphQL queryIDs + feature-flag
# defaults (queryids_gen.go, features_gen.go). x.com silently rotates queryIDs
# and feature-flag defaults inside its JS bundle; when it does, every call this
# library makes with a stale ID/flag starts returning HTTP 400. This job
# regenerates the files from the LIVE bundle and, if they changed, opens a PR
# for a human to eyeball the diff (same review gate as T3/T4 — never auto-merge
# generated values).
#
# REQUIRES repo secret TWITTER_PROXY: a proxy URL that can reach x.com from
# GitHub's runner IPs (x.com blocks bare datacenter IPs). Without it the live
# fetch will almost certainly be blocked and the job FAILS CLOSED — the
# -fail-on-empty flag makes gql-sync exit non-zero on 0 ops rather than wiping
# the committed IDs, so a bundle break (or missing proxy) surfaces loudly and
# never lands an empty regeneration.
name: gql-sync drift check

on:
  schedule:
    # Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Track the module's Go version instead of pinning it twice.
          go-version-file: go.mod

      - name: Regenerate from live bundle
        env:
          GOWORK: "off"
        # No -date: a daily-changing stamp would churn the file and open
        # spurious PRs. -fail-on-empty: a bundle break exits non-zero instead
        # of overwriting the committed IDs with nothing.
        run: go run ./cmd/gql-sync -proxy "${{ secrets.TWITTER_PROXY }}" -fail-on-empty

      - name: Open drift PR if generated files changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/gql-sync-drift-update
          title: "chore(gql-sync): queryID/feature-flag drift detected"
          labels: |
            automated
            drift
          commit-message: "chore(gql-sync): queryID/feature-flag drift detected"
          add-paths: |
            queryids_gen.go
            features_gen.go
          body: |
            ## gql-sync drift detected

            x.com rotated GraphQL **queryIDs** and/or **feature-flag defaults**
            in its live JS bundle. The diff below is the new values, regenerated
            from the bundle by the weekly `gql-sync drift check` workflow.

            **REVIEW before merge.** A wrong queryID or feature-flag default = an
            HTTP 400 on every call that uses it. Confirm the new values look
            sane (not zeroed, not garbage) before merging.

            ### If a known feature-flag value changed
            The drift guard `TestFeatureDrift_CommittedVsGenerated` compares
            `committedFeatures()` (the authed-session authority) against the
            generated baseline. If x.com flipped a flag this PR also touches,
            update `committedFeatures()` in `features_drift_test.go` to match, or
            the test will fail.

            ---
            Generated by `.github/workflows/gql-sync-drift.yml` — never
            auto-merged; a human eyeballs the diff.
